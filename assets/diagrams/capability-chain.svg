<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="140" viewBox="0 0 1120 140" role="img" aria-label="从空间数据到可交互数字人的能力链条">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <g>
      <rect x="20" y="35" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="95" y="62">空间数据</text>
      <text x="95" y="84" font-size="11" font-weight="400" fill="#8b949e">GIS · shp · 瓦片金字塔</text>
    </g>
    <g>
      <rect x="205" y="35" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
