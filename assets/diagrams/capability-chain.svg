      <text x="280" y="84" font-size="11" font-weight="400" fill="#8b949e">多边形 · 网格 · glTF</text>
    </g>
    <g>
      <rect x="390" y="35" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="465" y="62">渲染引擎</text>
      <text x="465" y="84" font-size="11" font-weight="400" fill="#8b949e">D3D · OpenGL · UE</text>
    </g>
    <g>
