  <g stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)">
    <line x1="172" y1="70" x2="202" y2="70"/>
    <line x1="357" y1="70" x2="387" y2="70"/>
    <line x1="542" y1="70" x2="572" y2="70"/>
    <line x1="727" y1="70" x2="757" y2="70"/>
    <line x1="912" y1="70" x2="942" y2="70"/>
