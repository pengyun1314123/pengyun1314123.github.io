<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-label="AIGC 全模态生成能力图谱">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Inputs -->
    <g font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">
      <rect x="20" y="60" width="150" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
      <text x="95" y="94">文本 Text</text>
      <rect x="20" y="150" width="150" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
      <text x="95" y="184">图像 Image</text>
      <rect x="20" y="240" width="150" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
      <text x="95" y="274">音频 / 姿态</text>
    </g>
    <!-- Engine -->
    <rect x="230" y="115" width="215" height="130" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="337" y="150" font-size="16" font-weight="700" fill="#e6edf3">生成模型底座</text>
      <text x="337" y="178" font-size="12" fill="#8b949e">Diffusion · DiT · Transformer</text>
      <text x="337" y="200" font-size="12" fill="#8b949e">LoRA / 自定义部署</text>
      <text x="337" y="222" font-size="12" fill="#8b949e">ComfyUI 编排与调用</text>
    </g>
    <!-- Input arrows -->
    <g stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)">
      <line x1="172" y1="88" x2="226" y2="145"/>
      <line x1="172" y1="178" x2="226" y2="180"/>
      <line x1="172" y1="268" x2="226" y2="215"/>
    </g>
    <!-- Bus -->
    <line x1="447" y1="180" x2="480" y2="180" stroke="#58a6ff" stroke-width="2"/>
    <line x1="480" y1="68" x2="480" y2="338" stroke="#58a6ff" stroke-width="2"/>
    <!-- Outputs -->
    <g font-size="14" font-weight="600" fill="#e6edf3">
      <g>
        <rect x="500" y="40" width="250" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="516" y="66">文生图 · T2I</text>
        <text x="516" y="88" font-size="11" font-weight="400" fill="#8b949e">创意图像与素材生成</text>
      </g>
      <g>
        <rect x="790" y="40" width="250" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="806" y="66">图生图 · I2I</text>
        <text x="806" y="88" font-size="11" font-weight="400" fill="#8b949e">图像编辑与风格迁移</text>
      </g>
      <g>
        <rect x="500" y="140" width="250" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="516" y="166">文生视频 · T2V</text>
        <text x="516" y="188" font-size="11" font-weight="400" fill="#8b949e">文本驱动动态内容</text>
      </g>
      <g>
        <rect x="790" y="140" width="250" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="806" y="166">图生视频 · I2V</text>
        <text x="806" y="188" font-size="11" font-weight="400" fill="#8b949e">人物 / 角色动画化</text>
      </g>
      <g>
        <rect x="500" y="240" width="250" height="64" rx="8" fill="#161b22" stroke="#3fb950"/>
        <text x="516" y="266">文 / 图生 3D</text>
        <text x="516" y="288" font-size="11" font-weight="400" fill="#8b949e">Tripo · 混元 3D 部署</text>
      </g>
      <g>
        <rect x="790" y="240" width="250" height="64" rx="8" fill="#161b22" stroke="#3fb950"/>
        <text x="806" y="266">3D 纹理与动作生成</text>
        <text x="806" y="288" font-size="11" font-weight="400" fill="#8b949e">UniTex · Audio2Motion</text>
      </g>
    </g>
    <!-- Bus to outputs -->
    <g stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)">
      <line x1="480" y1="72" x2="498" y2="72"/>
      <line x1="480" y1="172" x2="498" y2="172"/>
      <line x1="480" y1="272" x2="498" y2="272"/>
      <line x1="480" y1="72" x2="788" y2="72"/>
      <line x1="480" y1="172" x2="788" y2="172"/>
      <line x1="480" y1="272" x2="788" y2="272"/>
    </g>
    <text x="540" y="345" font-size="11" fill="#6e7681">覆盖从模型部署、ComfyUI 编排到业务服务落地的全链路</text>
  </g>
</svg>
